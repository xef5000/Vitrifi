[package]
name = "vitrifi"
version = "0.3.0"
edition = "2021"
description = "A compiled architecture language alongside your implementation"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
globset = "0.4"
walkdir = "2"
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tempfile = "3"

[dev-dependencies]
